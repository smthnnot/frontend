<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое чудо!!!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">логотип</div>

        <nav class="menu">
            <ul>
                <li><a href="#">База</a></li>
                <li><a href="#">Задания</a></li>
            </ul>
        </nav>

    </header>

    <main class="main-content">
        <section class="section">
            <h1>Картинка</h1>
            <div class="pic">
                <div class="curtain">
                <div class="curtain-scallops">
                    <div class="curtain-scallops-top"></div>
                    <div class="curtain-scallops-left"></div>
                    <div class="curtain-scallops-right"></div>
                </div>
                <div class="window">
                    <div class="sun"></div>
                </div>
                </div>

                <div class="chair chair-left">
                    <div class="chair-back">
                        <div class="chair-back-top"></div>
                        <div class="chair-back-bottom"></div>
                    </div>
                    <div class="chair-seat">
                        <div class="chair-rivets"></div>
                    </div>
                    <div class="chair-leg-front"></div>
                </div>

                <div class="table">
                    <div class="table-top"></div>
                    <div class="table-leg">
                        <div class="table-bulb"></div>
                    </div>
                    <div class="table-base"></div>
                </div>

                <div class="teapot">
                    <div class="teapot-knob"></div>
                    <div class="teapot-lid"></div>
                    <div class="teapot-spout"></div>
                    <div class="teapot-body"></div>
                    <div class="teapot-handle"></div>
                </div>

                <div class="chair chair-right">
                    <div class="chair-back">
                        <div class="chair-back-top"></div>
                        <div class="chair-back-bottom"></div>
                    </div>
                    <div class="chair-seat">
                        <div class="chair-rivets"></div>
                    </div>
                    <div class="chair-leg-front"></div>
                </div>

            </div>

        </section>

        
    </main>

    <footer class="footer">
        футер
    </footer>
</body>
</html>
